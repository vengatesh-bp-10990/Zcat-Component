<template tag-name="tooltip-comp">
  <div class="zcat-page-wrapper">
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Tooltip</h1>
      <p class="zcat-page-desc">Tooltips display contextual information when hovering over a trigger element. Ideal for labels, info icons, and truncated content.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area" style="padding:48px 24px; min-height:140px; display:flex; align-items:center; justify-content:center;">
            <div lt-prop-title="{{tooltipText}}" lt-prop-tooltip-config="{{demoTooltipConfig}}" class="zcat-tooltip-trigger" style="display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border:1px solid var(--zcat-border-1); border-radius:6px; cursor:default; font-size:13px; color:var(--zcat-text-primary);">
              <zcat-icon name="info" width="14" height="14" stroke="var(--zcat-primary-1)" strokeWidth="1.5"></zcat-icon>
              <span>Hover to see tooltip</span>
            </div>
          </div>
        </div>
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>

      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Placement</span>
            <select onchange="{{action('changePlacement', event)}}" class="zcat-custom-select">
              <option value="">Auto</option>
              <option value="top">Top</option>
              <option value="bottom">Bottom</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Placement Variants</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Top</span></div>
          <div class="zcat-variant-card-preview" style="padding:24px; display:flex; align-items:center; justify-content:center;">
            <span lt-prop-title="Tooltip on top" lt-prop-tooltip-config='{"position":"top"}' class="zcat-tooltip-trigger" style="padding:6px 14px; border:1px solid var(--zcat-border-1); border-radius:4px; cursor:default; font-size:12px; color:var(--zcat-text-primary);">Hover me</span>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Bottom</span></div>
          <div class="zcat-variant-card-preview" style="padding:24px; display:flex; align-items:center; justify-content:center;">
            <span lt-prop-title="Tooltip on bottom" lt-prop-tooltip-config='{"position":"bottom"}' class="zcat-tooltip-trigger" style="padding:6px 14px; border:1px solid var(--zcat-border-1); border-radius:4px; cursor:default; font-size:12px; color:var(--zcat-text-primary);">Hover me</span>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Left</span></div>
          <div class="zcat-variant-card-preview" style="padding:24px; display:flex; align-items:center; justify-content:center;">
            <span lt-prop-title="Tooltip on left" lt-prop-tooltip-config='{"position":"left"}' class="zcat-tooltip-trigger" style="padding:6px 14px; border:1px solid var(--zcat-border-1); border-radius:4px; cursor:default; font-size:12px; color:var(--zcat-text-primary);">Hover me</span>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Right</span></div>
          <div class="zcat-variant-card-preview" style="padding:24px; display:flex; align-items:center; justify-content:center;">
            <span lt-prop-title="Tooltip on right" lt-prop-tooltip-config='{"position":"right"}' class="zcat-tooltip-trigger" style="padding:6px 14px; border:1px solid var(--zcat-border-1); border-radius:4px; cursor:default; font-size:12px; color:var(--zcat-text-primary);">Hover me</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
