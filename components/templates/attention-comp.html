<template tag-name="attention-comp">
  <div class="zcat-page-wrapper">
    <!-- Header -->
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Attention</h1>
      <p class="zcat-page-desc">Attention banners are inline notices that provide contextual information, tips, or guidance within a page section. Available in Default, Info, Success, Danger and Warning types.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <!-- Body: Customize Tab -->
    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <!-- Left: Preview + Code -->
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area" style="padding:20px;">
            <zcat-attention self="{{self}}" zcat-prop="{{attentionObj}}"></zcat-attention>
          </div>
        </div>
        <!-- Code Tabs -->
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'newslyte' ? 'active' : ''}}" onclick="{{action('showNewSlyteTab')}}">sLyte New</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'newslyte'}}">{{newSlyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>

      <!-- Right: Customise -->
      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <!-- Type -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Type</span>
            <select data-action="changeAttentionType" class="zcat-custom-select">
              <option value="default">Default</option>
              <option value="info">Info</option>
              <option value="success">Success</option>
              <option value="danger">Danger</option>
              <option value="warning">Warning</option>
            </select>
          </div>
          <!-- Heading Text -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Heading</span>
            <input type="text" data-action="changeAttentionHeading" class="zcat-custom-input" value="{{attentionObj.name}}" placeholder="Heading text" />
          </div>
          <!-- Description toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Description</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleDescObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <!-- Body: All Variants Tab -->
    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Type Variants</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Default</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-attention self="{{self}}" zcat-prop="{{variantDefaultObj}}"></zcat-attention>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Info</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-attention self="{{self}}" zcat-prop="{{variantInfoObj}}"></zcat-attention>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Success</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-attention self="{{self}}" zcat-prop="{{variantSuccessObj}}"></zcat-attention>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Danger</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-attention self="{{self}}" zcat-prop="{{variantDangerObj}}"></zcat-attention>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Warning</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-attention self="{{self}}" zcat-prop="{{variantWarningObj}}"></zcat-attention>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Content Variants</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Heading Only</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-attention self="{{self}}" zcat-prop="{{variantHeadOnlyObj}}"></zcat-attention>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">With Description</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-attention self="{{self}}" zcat-prop="{{variantWithDescObj}}"></zcat-attention>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Long Content</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-attention self="{{self}}" zcat-prop="{{variantLongObj}}"></zcat-attention>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
