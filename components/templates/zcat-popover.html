<template tag-name="zcat-popover">
  <div class="zcat-popover-wrapper {{zcatProp.classCss || ''}}">
    <!-- Trigger -->
    <div class="zcat-popover-trigger" onclick="{{action('togglePopover')}}">
      <template lyte-if="{{zcatProp.trigger}}">
        <zcat-button self="{{self}}" zcat-prop="{{zcatProp.trigger}}"></zcat-button>
      </template>
      <template lyte-if="{{!zcatProp.trigger}}">
        <button class="zcat-popover-default-trigger">
          <zcat-icon name="more-vertical" width="16" height="16" stroke="currentColor" stroke-width="2"></zcat-icon>
        </button>
      </template>
    </div>
    <!-- Popover Menu -->
    <template lyte-if="{{isOpen}}">
      <div class="zcat-popover-menu {{zcatProp.position === 'top' ? 'zcat-popover-top' : zcatProp.position === 'left' ? 'zcat-popover-left' : zcatProp.position === 'right' ? 'zcat-popover-right' : 'zcat-popover-bottom'}}" style="{{zcatProp.width ? 'width:' + zcatProp.width : ''}}">
        <!-- Search -->
        <template lyte-if="{{zcatProp.isSearchable}}">
          <div class="zcat-popover-search">
            <zcat-icon name="search" width="14" height="14" stroke="currentColor" stroke-width="1.5"></zcat-icon>
            <input type="text" class="zcat-popover-search-input" placeholder="Search..." value="{{searchQuery}}" oninput="{{action('onSearchInput', event)}}"/>
          </div>
        </template>
        <!-- Heading -->
        <template lyte-if="{{zcatProp.heading}}">
          <div class="zcat-popover-heading">{{zcatProp.heading}}</div>
        </template>
        <!-- Options -->
        <div class="zcat-popover-options">
          <div class="zcat-popover-item {{item.disabled ? 'zcat-popover-item-disabled' : ''}} {{item.selected ? 'zcat-popover-item-selected' : ''}} {{item.nestedPopover ? 'zcat-popover-item-nested' : ''}}"
               lyte-for="{{zcatProp.options}} as item index"
               onclick="{{action('selectItem', item)}}"
               onmouseenter="{{action('showNested', index)}}"
               onmouseleave="{{action('hideNested')}}">
            <template lyte-if="{{item.icon}}">
              <zcat-icon name="{{item.icon}}" width="14" height="14" stroke="currentColor" stroke-width="1.5" class="zcat-popover-item-icon"></zcat-icon>
            </template>
            <span class="zcat-popover-item-label">{{item.name}}</span>
            <template lyte-if="{{item.nestedPopover}}">
              <zcat-icon name="chevron-right" width="12" height="12" stroke="currentColor" stroke-width="2" class="zcat-popover-item-arrow"></zcat-icon>
            </template>
            <!-- Nested submenu -->
            <template lyte-if="{{item.nestedPopover && activeNested === index}}">
              <div class="zcat-popover-submenu">
                <div class="zcat-popover-item {{sub.disabled ? 'zcat-popover-item-disabled' : ''}}"
                     lyte-for="{{item.options}} as sub subIdx"
                     onclick="{{action('selectItem', sub)}}">
                  <template lyte-if="{{sub.icon}}">
                    <zcat-icon name="{{sub.icon}}" width="14" height="14" stroke="currentColor" stroke-width="1.5" class="zcat-popover-item-icon"></zcat-icon>
                  </template>
                  <span class="zcat-popover-item-label">{{sub.name}}</span>
                </div>
              </div>
            </template>
          </div>
        </div>
        <!-- Create New -->
        <template lyte-if="{{zcatProp.createNewBtn}}">
          <div class="zcat-popover-create" onclick="{{action('onCreateNew')}}">
            <zcat-icon name="plus" width="14" height="14" stroke="currentColor" stroke-width="2"></zcat-icon>
            <span>Create New</span>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
