<template tag-name="cards-comp">
  <div class="zcat-page-wrapper">
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Cards</h1>
      <p class="zcat-page-desc">Selection cards supporting display-only, single-select (radio), and multi-select (checkbox) modes.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area" style="padding:24px">
            <zcat-cards self="{{self}}" zcat-prop="{{cardsObj}}"></zcat-cards>
          </div>
        </div>
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>
      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Selection Type</span>
            <select data-action="changeType" class="zcat-custom-select">
              <option value="default">Default (Display)</option>
              <option value="single_sel" selected>Single Select</option>
              <option value="multi_sel">Multi Select</option>
            </select>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Background</span>
            <select data-action="changeBg" class="zcat-custom-select">
              <option value="primary">Primary</option>
              <option value="secondary">Secondary</option>
              <option value="tertiary">Tertiary</option>
              <option value="quaternary">Quaternary</option>
              <option value="bodyBg">Body Background</option>
            </select>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Disabled</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleDisabledObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Selection Types</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Default (Display)</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px">
            <div class="zcat-cards-wrapper zcat-cards-default zcat-cards-horizontal" style="gap:8px">
              <div class="zcat-card primary" style="padding:12px;border-radius:10px;border:1px solid var(--zcat-card-border-default);flex:1">
                <div class="zcat-card-body"><div class="zcat-card-title" style="font-size:13px;font-weight:600">Option A</div></div>
              </div>
              <div class="zcat-card primary" style="padding:12px;border-radius:10px;border:1px solid var(--zcat-card-border-default);flex:1">
                <div class="zcat-card-body"><div class="zcat-card-title" style="font-size:13px;font-weight:600">Option B</div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Single Select</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px">
            <div class="zcat-cards-wrapper zcat-cards-single zcat-cards-horizontal" style="gap:8px">
              <div class="zcat-card primary selected" style="padding:12px;border-radius:10px;border:1px solid var(--zcat-card-border-selected);flex:1">
                <div class="zcat-card-body"><div class="zcat-card-title" style="font-size:13px;font-weight:600">Selected</div></div>
              </div>
              <div class="zcat-card primary" style="padding:12px;border-radius:10px;border:1px solid var(--zcat-card-border-default);flex:1">
                <div class="zcat-card-body"><div class="zcat-card-title" style="font-size:13px;font-weight:600">Unselected</div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Multi Select</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px">
            <div class="zcat-cards-wrapper zcat-cards-multi zcat-cards-horizontal" style="gap:8px">
              <div class="zcat-card primary selected" style="padding:12px;border-radius:10px;border:1px solid var(--zcat-card-border-selected);flex:1">
                <div class="zcat-card-body"><div class="zcat-card-title" style="font-size:13px;font-weight:600">Checked A</div></div>
              </div>
              <div class="zcat-card primary selected" style="padding:12px;border-radius:10px;border:1px solid var(--zcat-card-border-selected);flex:1">
                <div class="zcat-card-body"><div class="zcat-card-title" style="font-size:13px;font-weight:600">Checked B</div></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:20px">Background Variants</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Primary</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px">
            <div class="zcat-card primary" style="padding:12px;border-radius:10px;border:1px solid var(--zcat-card-border-default);background:var(--zcat-card-bg-default)">
              <div class="zcat-card-body"><div class="zcat-card-title" style="font-size:13px;font-weight:600">Primary Card</div></div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Secondary</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px">
            <div class="zcat-card secondary" style="padding:12px;border-radius:10px;border:1px solid var(--zcat-card-border-default);background:var(--zcat-card-bg-secondary)">
              <div class="zcat-card-body"><div class="zcat-card-title" style="font-size:13px;font-weight:600">Secondary Card</div></div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Disabled</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px">
            <div class="zcat-card disabled" style="padding:12px;border-radius:10px;border:1px solid var(--zcat-card-border-disabled);background:var(--zcat-card-bg-disabled);opacity:0.6">
              <div class="zcat-card-body"><div class="zcat-card-title" style="font-size:13px;font-weight:600">Disabled Card</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
