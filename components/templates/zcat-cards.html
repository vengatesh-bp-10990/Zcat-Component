<template tag-name="zcat-cards">
  <div class="zcat-cards-wrapper
    {{_wrapperTypeClass}}
    {{_wrapperLayoutClass}}
    {{zcatProp.disabled ? 'zcat-cards-disabled' : ''}}">

    <template lyte-for="{{_renderCards}} as card cardIdx">
      <div class="zcat-card
        {{card._bgVariant}}
        {{card.disabled ? 'disabled' : ''}}
        {{card._selectedClass}}"
           onclick="{{action('selectCard', card)}}">

        <!-- Selection indicator -->
        <template lyte-if="{{zcatProp.type === 'single_sel'}}">
          <div class="zcat-card-radio {{card._radioCheckedClass}}">
            <span class="zcat-card-radio-dot"></span>
          </div>
        </template>
        <template lyte-if="{{zcatProp.type === 'multi_sel'}}">
          <div class="zcat-card-checkbox {{card._checkboxCheckedClass}}">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </template>

        <!-- Card icon -->
        <template lyte-if="{{card.icon}}">
          <div class="zcat-card-icon">
            <zcat-icon name="{{card.icon}}" width="24" height="24" stroke="currentColor" stroke-width="1.5"></zcat-icon>
          </div>
        </template>

        <!-- Card content -->
        <div class="zcat-card-body">
          <template lyte-if="{{card.title}}">
            <div class="zcat-card-title">{{card.title}}</div>
          </template>
          <template lyte-if="{{card.description}}">
            <div class="zcat-card-desc">{{card.description}}</div>
          </template>
        </div>

        <!-- Selected checkmark (corner) -->
        <template lyte-if="{{card._isSelected}}">
          <div class="zcat-card-selected-mark">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
