<template tag-name="installation-comp">
  <div class="zcat-page-wrapper">
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Installation</h1>
      <p class="zcat-page-desc">Get ZCAT components set up in your sLyte project in minutes.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab active">Setup Guide</span>
      </div>
    </div>

    <div class="zcat-page-body">
      <div class="zcat-page-left" style="max-width:820px;">

        <!-- Prerequisites -->
        <div class="zcat-content-section">
          <h2 class="zcat-content-heading">Prerequisites</h2>
          <p class="zcat-content-text">Before you begin, make sure you have the following installed:</p>
          <ul class="zcat-content-list">
            <li><strong>Node.js</strong> v18 or later</li>
            <li><strong>npm</strong> v9 or later (comes with Node.js)</li>
            <li><strong>sLyte CLI</strong> — the sLyte command-line tool</li>
          </ul>
        </div>

        <!-- Step 1 -->
        <div class="zcat-content-section">
          <h2 class="zcat-content-heading">Step 1 — Install sLyte CLI</h2>
          <p class="zcat-content-text">Install the sLyte CLI globally from the Zoho npm registry:</p>
          <div class="zcat-code-panel zcat-content-code">
            <pre>npm install -g @aspect/slyte-cli --registry http://cm-npmregistry</pre>
          </div>
        </div>

        <!-- Step 2 -->
        <div class="zcat-content-section">
          <h2 class="zcat-content-heading">Step 2 — Create a new project</h2>
          <p class="zcat-content-text">Scaffold a new sLyte application using the CLI:</p>
          <div class="zcat-code-panel zcat-content-code">
            <pre>slyte create my-app
cd my-app</pre>
          </div>
        </div>

        <!-- Step 3 -->
        <div class="zcat-content-section">
          <h2 class="zcat-content-heading">Step 3 — Install dependencies</h2>
          <p class="zcat-content-text">Install all required packages from the Zoho npm registry:</p>
          <div class="zcat-code-panel zcat-content-code">
            <pre>npm install --registry http://cm-npmregistry</pre>
          </div>
        </div>

        <!-- Step 4 -->
        <div class="zcat-content-section">
          <h2 class="zcat-content-heading">Step 4 — Add ZCAT component files</h2>
          <p class="zcat-content-text">
            Copy the ZCAT component files into your sLyte project's <strong>components</strong> folder. Each component consists of three files — a template (HTML), logic (JS), and styles (CSS):
          </p>
          <div class="zcat-code-panel zcat-content-code">
            <pre>my-app/
├── components/
│   ├── templates/
│   │   ├── zcat-button.html
│   │   ├── zcat-input.html
│   │   └── zcat-dropdown.html
│   ├── javascript/
│   │   ├── zcat-button.js
│   │   ├── zcat-input.js
│   │   └── zcat-dropdown.js
│   └── styles/
│       ├── zcat-tokens.css        ← Design tokens (required)
│       ├── zcat-button.css
│       ├── zcat-input.css
│       └── zcat-dropdown.css</pre>
          </div>
          <p class="zcat-content-text" style="margin-top:12px;">
            You only need to copy the components you plan to use. However, <strong>zcat-tokens.css</strong> is always required — it defines all the color, spacing, and typography tokens used by every component.
          </p>

          <!-- Download Panel -->
          <div class="zcat-download-panel" style="margin-top:20px; padding:24px; background:var(--zcat-prev-bg); border-radius:12px; border:1px solid var(--zcat-body-border);">

                <p style="font-size:13px; color:var(--zcat-body-text-grey); margin:4px 0 0;">Download individual components or the full package.</p>
              </div>
              <div class="zcat-dl-all-btn" onclick="{{action('downloadAll')}}" style="display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:var(--zcat-btn-fill-bg-primary-default); color:#fff; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; transition:background 0.15s; font-family:var(--zcat-font-family-primary);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download All (10 files)
              </div>
            </div>

            <!-- Design Tokens -->
            <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--zcat-body-bg); border:1px solid var(--zcat-body-border); border-radius:8px; margin-bottom:8px;">

            <!-- Button -->
            <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--zcat-body-bg); border:1px solid var(--zcat-body-border); border-radius:8px; margin-bottom:8px;">

                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  JS
                </div>

                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

            <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--zcat-body-bg); border:1px solid var(--zcat-body-border); border-radius:8px; margin-bottom:8px;">
              <div style="display:flex; align-items:center; gap:10px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--zcat-btn-fill-bg-danger-default)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="14"/></svg>
                <div>
                  <p style="font-size:13px; font-weight:500; color:var(--zcat-body-text-primary); margin:0;">Input Component</p>
                  <p style="font-size:12px; color:var(--zcat-body-text-grey); margin:2px 0 0;">zcat-input.html + zcat-input.js + zcat-input.css</p>
                </div>
              </div>
              <div style="display:flex; gap:6px;">
                <div onclick="{{action('downloadFile', 'input', 'html')}}" style="display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border:1px solid var(--zcat-body-border); border-radius:6px; font-size:12px; font-weight:500; color:var(--zcat-body-text-secondary); cursor:pointer; background:var(--zcat-body-bg); font-family:var(--zcat-font-family-primary);">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  HTML
                </div>
                <div onclick="{{action('downloadFile', 'input', 'js')}}" style="display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border:1px solid var(--zcat-body-border); border-radius:6px; font-size:12px; font-weight:500; color:var(--zcat-body-text-secondary); cursor:pointer; background:var(--zcat-body-bg); font-family:var(--zcat-font-family-primary);">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  JS
                </div>
                <div onclick="{{action('downloadFile', 'input', 'css')}}" style="display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border:1px solid var(--zcat-body-border); border-radius:6px; font-size:12px; font-weight:500; color:var(--zcat-body-text-secondary); cursor:pointer; background:var(--zcat-body-bg); font-family:var(--zcat-font-family-primary);">

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><polyline points="8 14 12 18 16 14"/></svg>

                  <p style="font-size:12px; color:var(--zcat-body-text-grey); margin:2px 0 0;">zcat-dropdown.html + zcat-dropdown.js + zcat-dropdown.css</p>

              <div style="display:flex; gap:6px;">

                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  JS

                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

        <!-- Step 5 -->
        <div class="zcat-content-section">
          <h2 class="zcat-content-heading">Step 5 — Include design tokens</h2>
          <p class="zcat-content-text">
            The <strong>zcat-tokens.css</strong> file provides all CSS custom properties (variables) used by ZCAT components. It includes tokens for buttons, inputs, dropdowns, body text, and dark mode variants.
          </p>
          <p class="zcat-content-text" style="margin-top:8px;">
            sLyte automatically loads CSS files placed in the <strong>components/styles/</strong> folder, so no manual import is needed. Just make sure <strong>zcat-tokens.css</strong> is in that directory.
          </p>
          <div class="zcat-code-panel zcat-content-code">
            <pre>/* zcat-tokens.css — key token categories */

:root {
  /* Font */
  --zcat-font-family-primary: 'Inter', sans-serif;

  /* Button tokens */
  --zcat-btn-fill-bg-primary-default: #2B6AF3;
  --zcat-btn-outline-text-primary-default: #2B6AF3;
  --zcat-btn-grey-bg-default: #F0F1F3;
  --zcat-btn-ghost-text-primary-default: #2B6AF3;

  /* Input tokens */
  --zcat-inputField-bg-default: #FFFFFF;
  --zcat-inputField-border-default: 1px solid #D6DDEF;
  --zcat-inputField-text-label: #4D618A;

  /* Body / General */
  --zcat-body-bg: #FFFFFF;
  --zcat-body-text-primary: #101F3E;

  /* ... 200+ tokens — see full file for all values */
}</pre>
          </div>
        </div>

        <!-- Step 6 -->
        <div class="zcat-content-section">
          <h2 class="zcat-content-heading">Step 6 — Add fonts</h2>
          <p class="zcat-content-text">
            ZCAT components use <strong>Zoho Puvi</strong> as the primary font. Add the font via CDN in your app's <strong>index.html</strong> or layout template:
          </p>
          <div class="zcat-code-panel zcat-content-code">
            <pre>&lt;!-- In your index.html &lt;head&gt; --&gt;
&lt;style&gt;
  @font-face {
    font-family: 'Zoho Puvi';
    src: url('https://static.zohocdn.com/zohofonts/zohopuvi/4.0/Zoho_Puvi_Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'Zoho Puvi';
    src: url('https://static.zohocdn.com/zohofonts/zohopuvi/4.0/Zoho_Puvi_Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: 'Zoho Puvi';
    src: url('https://static.zohocdn.com/zohofonts/zohopuvi/4.0/Zoho_Puvi_Semibold.woff2') format('woff2');
    font-weight: 600;
    font-display: swap;
  }
&lt;/style&gt;</pre>
          </div>
          <p class="zcat-content-text" style="margin-top:8px;">
            Then update the font token in <strong>zcat-tokens.css</strong>:
          </p>
          <div class="zcat-code-panel zcat-content-code">
            <pre>:root {
  --zcat-font-family-primary: 'Zoho Puvi', 'Inter', sans-serif;
}</pre>
          </div>
          <p class="zcat-content-text" style="margin-top:8px; color: var(--zcat-body-text-grey); font-size:13px;">
            Alternatively, you can use <strong>Inter</strong> from Google Fonts — no @font-face is needed, just add the &lt;link&gt; tag.
          </p>
        </div>

        <!-- Step 7 -->
        <div class="zcat-content-section">
          <h2 class="zcat-content-heading">Step 7 — Start the dev server</h2>
          <p class="zcat-content-text">Run the development server to see your app:</p>
          <div class="zcat-code-panel zcat-content-code">
            <pre>npx slyte serve --port=3000</pre>
          </div>
          <p class="zcat-content-text" style="margin-top:12px;">
            Open <strong>http://localhost:3000</strong> in your browser. sLyte will automatically detect and register all component files in the <strong>components/</strong> directory. You're ready to start using ZCAT components!
          </p>
        </div>
