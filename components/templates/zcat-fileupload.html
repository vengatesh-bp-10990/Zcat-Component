<template tag-name="zcat-fileupload">
  <div class="zcat-fileupload-wrapper
    {{zcatProp.variant === 'secondary' ? 'zcat-fileupload-secondary' : 'zcat-fileupload-primary'}}
    {{zcatProp.disabled ? 'zcat-fileupload-disabled' : ''}}">

    <!-- Label Row -->
    <template lyte-if="{{zcatProp.label}}">
      <div class="zcat-fileupload-label-row">
        <label class="zcat-fileupload-label">{{zcatProp.label}}</label>
        <template lyte-if="{{zcatProp.isOptional}}">
          <span class="zcat-fileupload-optional">(Optional)</span>
        </template>
      </div>
    </template>

    <!-- Hidden File Input -->
    <input
      type="file"
      class="zcat-fileupload-hidden-input"
      style="display:none"
      multiple="{{zcatProp.multiple || false}}"
      accept="{{zcatProp.accept || ''}}"
      onchange="{{action('onFileInputChange')}}"
    />

    <!-- === PRIMARY: Drop Zone === -->
    <template lyte-if="{{zcatProp.variant !== 'secondary'}}">
      <div class="zcat-fileupload-dropzone {{isDragging ? 'dragging' : ''}}"
           ondragenter="{{action('onDragEnter')}}"
           ondragover="{{action('onDragOver')}}"
           ondragleave="{{action('onDragLeave')}}"
           ondrop="{{action('onDrop')}}"
           onclick="{{action('triggerFileInput')}}">
        <div class="zcat-fileupload-dropzone-content">
          <svg class="zcat-fileupload-upload-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p class="zcat-fileupload-dropzone-text">
            <span class="zcat-fileupload-browse-link">Click to upload</span> or drag and drop
          </p>
          <template lyte-if="{{zcatProp.hint}}">
            <p class="zcat-fileupload-dropzone-hint">{{zcatProp.hint}}</p>
          </template>
        </div>
      </div>
    </template>

    <!-- === SECONDARY: Button trigger === -->
    <template lyte-if="{{zcatProp.variant === 'secondary'}}">
      <div class="zcat-fileupload-btn-wrap">
        <button class="zcat-fileupload-btn" onclick="{{action('triggerFileInput')}}" disabled="{{zcatProp.disabled || false}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span>{{zcatProp.buttonLabel || 'Choose File'}}</span>
        </button>
        <template lyte-if="{{zcatProp.hint}}">
          <span class="zcat-fileupload-btn-hint">{{zcatProp.hint}}</span>
        </template>
      </div>
    </template>

    <!-- File List -->
    <template lyte-if="{{files.length}}">
      <div class="zcat-fileupload-list">
        <template lyte-for="{{files}} as file fileIdx">
          <div class="zcat-fileupload-file">
            <div class="zcat-fileupload-file-icon">
              <zcat-icon name="{{file.icon || 'file'}}" width="18" height="18" stroke="currentColor" stroke-width="1.5"></zcat-icon>
            </div>
            <div class="zcat-fileupload-file-info">
              <span class="zcat-fileupload-file-name">{{file.name}}</span>
              <span class="zcat-fileupload-file-size">{{file._sizeLabel}}</span>
            </div>
            <span class="zcat-fileupload-file-remove" onclick="{{action('removeFile', file)}}">
              <zcat-icon name="close" width="14" height="14" stroke="currentColor" stroke-width="2"></zcat-icon>
            </span>
          </div>
        </template>
      </div>
    </template>

    <!-- Error Message -->
    <template lyte-if="{{errorMessage}}">
      <div class="zcat-fileupload-error-msg">{{errorMessage}}</div>
    </template>
  </div>
</template>
