<template tag-name="button-comp">
  <div class="zcat-page-wrapper">
    <!-- Header -->
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Buttons</h1>
      <p class="zcat-page-desc">A button triggers an event or action. They let users know what will happen next.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <!-- Body: Customize Tab -->
    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <!-- Left: Preview + Code -->
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area">
            <zcat-button self="{{self}}" zcat-prop="{{btnStyles}}"></zcat-button>
          </div>
        </div>

        <!-- Code Tabs -->
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'newslyte' ? 'active' : ''}}" onclick="{{action('showNewSlyteTab')}}">sLyte New</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'newslyte'}}">{{newSlyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </span>
        </div>
      </div>

      <!-- Right: Customise -->
      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <!-- Variant -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Variant</span>
            <select data-action="changeBtnVariant" class="zcat-custom-select">
              <option value="fill">Fill</option>
              <option value="outline">Outline</option>
              <option value="ghost">Ghost</option>
              <option value="grey">Grey</option>
            </select>
          </div>
          <!-- Size -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Size</span>
            <select data-action="changeBtnSize" class="zcat-custom-select">
              <option value="default">Default</option>
              <option value="small">Small</option>
              <option value="extra-small">Extra-small</option>
              <option value="large">Large</option>
            </select>
          </div>
          <!-- Color -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Color</span>
            <select data-action="changeBtnColor" class="zcat-custom-select">
              <option value="primary">Primary</option>
              <option value="success">Success</option>
              <option value="danger">Danger</option>
            </select>
          </div>
          <!-- State -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">State</span>
            <select data-action="changeBtnState" class="zcat-custom-select">
              <option value="default">Default</option>
              <option value="loading">Loading</option>
              <option value="disabled">Disabled</option>
            </select>
          </div>
          <!-- Icon Left toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Icon Left</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleIconLeftObj}}"></zcat-toggle>
          </div>
          <!-- Icon Right toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Icon Right</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleIconRightObj}}"></zcat-toggle>
          </div>
          <!-- Split Button toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Split Button</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleSplitObj}}"></zcat-toggle>
          </div>
          <!-- Only Icon toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Only Icon</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleOnlyIconObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <!-- Body: All Variants Tab -->
    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Fill Variants</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Primary</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn fill primary">Primary</button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Success</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn fill success">Success</button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Danger</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn fill danger">Danger</button></div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Outline Variants</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Primary</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn outline primary">Primary</button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Success</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn outline success">Success</button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Danger</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn outline danger">Danger</button></div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Ghost Variants</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Primary</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn ghost primary">Primary</button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Success</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn ghost success">Success</button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Danger</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn ghost danger">Danger</button></div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Grey &amp; Sizes</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Grey</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn grey grey">Grey</button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Small</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn fill primary zcat-btn-sm">Small</button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Extra Small</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn fill primary zcat-btn-exsm">Extra Small</button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Large</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn fill primary zcat-btn-lg">Large</button></div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">States &amp; Special</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Disabled</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn fill primary" disabled>Disabled</button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Loading</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn fill primary loading"><span class="zcat-btn-text">Loading</span><span class="zcat-btn-loader-wrap"><span class="zcat-btn-loader"></span></span></button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Icon Only</span></div>
          <div class="zcat-variant-card-preview"><button class="zcat-btn fill primary icon-only"><svg class="zcat-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Split Button</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-split-group"><button class="zcat-btn fill primary split-body"><span class="zcat-btn-text">Split</span></button><button class="zcat-btn fill primary split-arrow"><svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="0,0 10,5 0,10"/></svg></button></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
