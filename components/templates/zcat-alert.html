<template tag-name="zcat-alert">
  <div class="zcat-alert-banner {{zcatProp.type || 'info'}} {{zcatProp.header ? 'zcat-alert-has-header' : ''}} {{zcatProp.closable === false ? '' : 'zcat-alert-closable'}}"
       lyte-if="{{showAlert}}">
    <div class="zcat-alert-left">
      <div class="zcat-alert-icon-wrap">
        <zcat-icon lyte-if="{{zcatProp.type === 'success'}}" name="alert-success" width="{{zcatProp.header ? '20' : '16'}}" height="{{zcatProp.header ? '20' : '16'}}" stroke="var(--zcat-toast-icon-line-success)" stroke-width="2"></zcat-icon>
        <zcat-icon lyte-if="{{zcatProp.type === 'error'}}" name="alert-danger" width="{{zcatProp.header ? '20' : '16'}}" height="{{zcatProp.header ? '20' : '16'}}" stroke="var(--zcat-toast-icon-line-danger)" stroke-width="2"></zcat-icon>
        <zcat-icon lyte-if="{{zcatProp.type === 'warning'}}" name="alert-warning" width="{{zcatProp.header ? '20' : '16'}}" height="{{zcatProp.header ? '20' : '16'}}" stroke="var(--zcat-toast-icon-line-warning)" stroke-width="2"></zcat-icon>
        <zcat-icon lyte-if="{{zcatProp.type !== 'success' && zcatProp.type !== 'error' && zcatProp.type !== 'warning'}}" name="alert-info" width="{{zcatProp.header ? '20' : '16'}}" height="{{zcatProp.header ? '20' : '16'}}" stroke="var(--zcat-toast-icon-line-info)" stroke-width="2"></zcat-icon>
      </div>
      <div class="zcat-alert-text">
        <p lyte-if="{{zcatProp.header}}" class="zcat-alert-header">{{zcatProp.header}}</p>
        <p class="zcat-alert-desc {{zcatProp.header ? '' : 'zcat-alert-desc-only'}}">{{zcatProp.desc}}</p>
      </div>
    </div>
    <div class="zcat-alert-right">
      <button lyte-if="{{zcatProp.closable !== false}}" class="zcat-alert-close" onclick="{{action('closeAlert')}}">
        <zcat-icon name="close" width="12" height="12" stroke="currentColor" stroke-width="2"></zcat-icon>
      </button>
    </div>
  </div>
</template>
