<template tag-name="dropdown-comp">
  <div class="zcat-page-wrapper">
    <!-- Header -->
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Dropdown</h1>
      <p class="zcat-page-desc">A dropdown lets users choose one or more options from a collapsible list. Use it when the option set is too large for radio buttons or checkboxes.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <!-- Body: Customize Tab -->
    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <!-- Left: Preview + Code -->
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area">
            <zcat-dropdown self="{{self}}" zcat-prop="{{dropdownStyles}}"></zcat-dropdown>
          </div>
        </div>

        <!-- Code Tabs -->
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'newslyte' ? 'active' : ''}}" onclick="{{action('showNewSlyteTab')}}">sLyte New</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'newslyte'}}">{{newSlyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>

      <!-- Right: Customise -->
      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <!-- Variant -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Variant</span>
            <select onchange="{{action('changeDropdownVariant', event)}}" class="zcat-custom-select">
              <option value="default">Default</option>
              <option value="ghost">Ghost</option>
              <option value="secondary">Link Dropdown</option>
              <option value="multiple">Multiple</option>
            </select>
          </div>
          <!-- Types of Multiple dropdown (shown when variant=multiple) -->
          <div class="zcat-custom-row" lyte-if="{{showMultiOptions}}">
            <span class="zcat-custom-label">Types of Multiple dropdown</span>
            <select onchange="{{action('changeMultipleType', event)}}" class="zcat-custom-select">
              <option value="default">Default</option>
              <option value="chip">Chip</option>
            </select>
          </div>
          <!-- Size -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Size</span>
            <select onchange="{{action('changeDropdownSize', event)}}" class="zcat-custom-select">
              <option value="default">Default</option>
              <option value="small">Small</option>
              <option value="extra-small">Extra-small</option>
            </select>
          </div>
          <!-- Label toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Label</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleLabelObj}}"></zcat-toggle>
          </div>
          <!-- Label with Info Icon toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Label with Info Icon</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleLabelInfoIconObj}}"></zcat-toggle>
          </div>
          <!-- Optional toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Optional</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleOptionalObj}}"></zcat-toggle>
          </div>
          <!-- Icon Left toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Icon Left</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleIconLeftObj}}"></zcat-toggle>
          </div>
          <!-- Input State -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Input State</span>
            <select onchange="{{action('changeDropdownState', event)}}" class="zcat-custom-select">
              <option value="default">Default</option>
              <option value="disabled">Disabled</option>
              <option value="error">Error</option>
            </select>
          </div>
          <!-- Dropdown Width -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Dropdown Width</span>
            <select onchange="{{action('changeDropdownWidth', event)}}" class="zcat-custom-select">
              <option value="zcat-w200">200px</option>
              <option value="zcat-w300">300px</option>
              <option value="zcat-w100p">Full-width</option>
              <option value="zcat-w-fc">Fit-content</option>
            </select>
          </div>

          <!-- MenuList Customization Section -->
          <div class="zcat-custom-section-title" style="margin-top:16px;margin-bottom:8px;font-weight:600;font-size:13px;color:var(--zcat-body-text-primary)">MenuList Customization</div>
          <!-- Types of Multiple MenuList (shown when variant=multiple) -->
          <div class="zcat-custom-row" lyte-if="{{showMultiOptions}}">
            <span class="zcat-custom-label">Types of Multiple MenuList</span>
            <select onchange="{{action('changeMenuListType', event)}}" class="zcat-custom-select">
              <option value="checkbox">Checkbox</option>
              <option value="default">Default</option>
            </select>
          </div>
          <!-- Header toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Header</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleMenuHeaderObj}}"></zcat-toggle>
          </div>
          <!-- SearchField toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">SearchField</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleMenuSearchObj}}"></zcat-toggle>
          </div>
          <!-- Include Button (Create New) toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Include Button</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleCreateNewObj}}"></zcat-toggle>
          </div>
          <!-- Show Icon toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Show Icon</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleMenuIconObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <!-- Body: All Variants Tab -->
    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Default Variants</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Default</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper" style="width:180px">
              <div class="zcat-dropdown-label-row"><label class="zcat-dropdown-label">Label</label></div>
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-value">India</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">With Placeholder</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper" style="width:180px">
              <div class="zcat-dropdown-label-row"><label class="zcat-dropdown-label">Label</label></div>
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-placeholder">Select Option</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Optional</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper" style="width:180px">
              <div class="zcat-dropdown-label-row"><label class="zcat-dropdown-label">Label <span class="zcat-dropdown-optional">(Optional)</span></label></div>
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-value">India</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Ghost Variant</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Ghost</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper zcat-dropdown-ghost" style="width:180px">
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-value">India</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Ghost Placeholder</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper zcat-dropdown-ghost" style="width:180px">
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-placeholder">Select Option</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Sizes</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Default (36px)</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper" style="width:180px">
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-value">India</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Small (28px)</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper zcat-dropdown-sm" style="width:180px">
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-value">India</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Extra-small (24px)</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper zcat-dropdown-exsm" style="width:180px">
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-value">India</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">States</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Disabled</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper zcat-dropdown-disabled" style="width:180px">
              <div class="zcat-dropdown-label-row zcat-dropdown-label-disabled"><label class="zcat-dropdown-label">Label</label></div>
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-value">India</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Error</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper zcat-dropdown-error" style="width:180px;padding-bottom:20px">
              <div class="zcat-dropdown-label-row"><label class="zcat-dropdown-label">Label</label></div>
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-value">India</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
              <span class="zcat-dropdown-error-msg">This field is required</span>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Ghost Disabled</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper zcat-dropdown-ghost zcat-dropdown-disabled" style="width:180px">
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-value">India</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Menu Features</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">With Icon Left</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper" style="width:180px">
              <div class="zcat-dropdown-label-row"><label class="zcat-dropdown-label">Label</label></div>
              <div class="zcat-dropdown-trigger-wrap">
                <svg class="zcat-dropdown-icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--zcat-inputField-icon-label)" stroke-width="1.3"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <div class="zcat-dropdown-trigger has-icon-left">
                  <span class="zcat-dropdown-value">India</span>
                  <span class="zcat-dropdown-arrow"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">With Label Info</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-dropdown-wrapper" style="width:180px">
              <div class="zcat-dropdown-label-row">
                <label class="zcat-dropdown-label">Label</label>
                <svg class="zcat-dropdown-info-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--zcat-inputField-icon-label)" stroke-width="1.3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              </div>
              <div class="zcat-dropdown-trigger-wrap"><div class="zcat-dropdown-trigger">
                <span class="zcat-dropdown-value">India</span>
                <span class="zcat-dropdown-arrow"></span>
              </div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
