<template tag-name="input-comp">
  <div class="zcat-page-wrapper">
    <!-- Header -->
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Text-box</h1>
      <p class="zcat-page-desc">Text and TextArea input fields for collecting user data.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <!-- Body: Customize Tab -->
    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <!-- Left: Preview + Code -->
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area">
            <zcat-input self="{{self}}" zcat-prop="{{inputObj}}"></zcat-input>
          </div>
        </div>

        <!-- Code Tabs -->
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'newslyte' ? 'active' : ''}}" onclick="{{action('showNewSlyteTab')}}">sLyte New</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'newslyte'}}">{{newSlyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </span>
        </div>
      </div>

      <!-- Right: Customise -->
      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <!-- Type -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Type</span>
            <select data-action="changeInputType" class="zcat-custom-select">
              <option value="text">Text</option>
              <option value="textarea">Textarea</option>
            </select>
          </div>
          <!-- Size -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Size</span>
            <select data-action="changeInputSize" class="zcat-custom-select">
              <option value="default">Default</option>
              <option value="small">Small</option>
              <option value="extra-small">Extra-small</option>
            </select>
          </div>
          <!-- Label toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Label</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleLabelObj}}"></zcat-toggle>
          </div>
          <!-- Disabled toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Disabled</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleDisabledObj}}"></zcat-toggle>
          </div>
          <!-- Error toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Show Error</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleErrorObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <!-- Body: All Variants Tab -->
    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Text Input Sizes</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Default</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-input-wrapper"><input type="text" class="zcat-input-el" placeholder="Default size" style="width:220px" /></div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Small</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-input-wrapper"><input type="text" class="zcat-input-el zcat-input-sm" placeholder="Small size" style="width:220px" /></div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Extra Small</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-input-wrapper"><input type="text" class="zcat-input-el zcat-input-exsm" placeholder="Extra small" style="width:220px" /></div>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">With Label</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Labeled Input</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-input-wrapper"><label class="zcat-input-label">Label</label><input type="text" class="zcat-input-el" placeholder="With label" style="width:220px" /></div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Textarea</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-input-wrapper"><label class="zcat-input-label">Description</label><textarea class="zcat-input-el" placeholder="Enter description" style="width:220px"></textarea></div>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">States</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Disabled</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-input-wrapper"><input type="text" class="zcat-input-el" placeholder="Disabled" style="width:220px" disabled /></div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Error</span></div>
          <div class="zcat-variant-card-preview">
            <div class="zcat-input-wrapper"><input type="text" class="zcat-input-el zcat-input-error" placeholder="Error state" style="width:220px" /><span class="zcat-input-error-msg">This field is required</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
