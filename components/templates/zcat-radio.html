<template tag-name="zcat-radio">
  <div class="zcat-radio-group
    {{zcatProp.size === 'small' ? 'zcat-radio-sm' : zcatProp.size === 'extra-small' ? 'zcat-radio-exsm' : ''}}
    {{zcatProp.variant === 'secondary' ? 'zcat-radio-secondary' : 'zcat-radio-primary'}}
    {{zcatProp.disabled ? 'zcat-radio-disabled' : ''}}
    {{zcatProp.direction === 'horizontal' ? 'zcat-radio-horizontal' : 'zcat-radio-vertical'}}
    {{zcatProp.classCss || ''}}">
    <template lyte-if="{{zcatProp.label}}">
      <span class="zcat-radio-group-label">{{zcatProp.label}}</span>
    </template>
    <div class="zcat-radio-options">
      <label class="zcat-radio-wrap {{item.disabled ? 'zcat-radio-item-disabled' : ''}} {{selectedValue === item.value ? 'zcat-radio-selected' : ''}} {{item.desc ? 'zcat-radio-has-desc' : ''}}"
             lyte-for="{{zcatProp.options}} as item index"
             onclick="{{action('onRadioSelect', item)}}">
        <input type="radio"
               class="zcat-radio-input"
               name="{{zcatProp.name || 'zcat-radio-default'}}"
               value="{{item.value}}"
               disabled="{{item.disabled || zcatProp.disabled}}"
               checked="{{selectedValue === item.value}}"/>
        <span class="zcat-radio-circle {{selectedValue === item.value ? 'checked' : ''}}">
          <span class="zcat-radio-dot"></span>
        </span>
        <template lyte-if="{{zcatProp.variant === 'secondary'}}">
          <div class="zcat-radio-content">
            <span class="zcat-radio-label">{{item.label}}</span>
            <template lyte-if="{{item.desc}}">
              <span class="zcat-radio-desc">{{item.desc}}</span>
            </template>
          </div>
        </template>
        <template lyte-if="{{zcatProp.variant !== 'secondary'}}">
          <span class="zcat-radio-label">{{item.label}}</span>
        </template>
      </label>
    </div>
  </div>
</template>
