<template tag-name="zcat-datepicker">
  <div class="zcat-datepicker-wrapper
    {{zcatProp.size === 'small' ? 'zcat-datepicker-sm' : zcatProp.size === 'extra-small' ? 'zcat-datepicker-exsm' : ''}}
    {{zcatProp.disabled ? 'zcat-datepicker-disabled' : ''}}
    {{zcatProp.errorMessage ? 'zcat-datepicker-error' : ''}}">

    <!-- Label Row -->
    <template lyte-if="{{zcatProp.label}}">
      <div class="zcat-datepicker-label-row">
        <label class="zcat-datepicker-label">{{zcatProp.label}}</label>
        <template lyte-if="{{zcatProp.isOptional}}">
          <span class="zcat-datepicker-optional">(Optional)</span>
        </template>
      </div>
    </template>

    <!-- Input trigger -->
    <div class="zcat-datepicker-input-wrap" onclick="{{action('togglePicker')}}">
      <zcat-icon class="zcat-datepicker-cal-icon" name="calendar" width="{{zcatProp.size === 'extra-small' ? '12' : '14'}}" height="{{zcatProp.size === 'extra-small' ? '12' : '14'}}" stroke="var(--zcat-inputField-icon-placeholder)" stroke-width="1.3"></zcat-icon>
      <input
        type="text"
        class="zcat-datepicker-input"
        placeholder="{{zcatProp.placeholder || 'Select date'}}"
        value="{{displayValue}}"
        readonly="true"
        disabled="{{zcatProp.disabled || false}}"
        style="{{zcatProp.width ? 'width:' + zcatProp.width : ''}}"
      />
      <span class="zcat-datepicker-arrow"></span>
    </div>

    <!-- Popover / Calendar Panel -->
    <div class="zcat-datepicker-popover {{isOpen ? 'open' : ''}}">
      <!-- Calendar Header -->
      <div class="zcat-datepicker-cal-header">
        <span class="zcat-datepicker-nav-btn" onclick="{{action('prevMonth')}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </span>
        <span class="zcat-datepicker-month-label">{{monthLabel}}</span>
        <span class="zcat-datepicker-nav-btn" onclick="{{action('nextMonth')}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
        </span>
      </div>

      <!-- Day Names -->
      <div class="zcat-datepicker-weekdays">
        <span class="zcat-datepicker-weekday">Su</span>
        <span class="zcat-datepicker-weekday">Mo</span>
        <span class="zcat-datepicker-weekday">Tu</span>
        <span class="zcat-datepicker-weekday">We</span>
        <span class="zcat-datepicker-weekday">Th</span>
        <span class="zcat-datepicker-weekday">Fr</span>
        <span class="zcat-datepicker-weekday">Sa</span>
      </div>

      <!-- Calendar Grid -->
      <div class="zcat-datepicker-grid">
        <template lyte-for="{{calendarDays}} as dayObj dayIdx">
          <span class="zcat-datepicker-day
            {{dayObj.current ? '' : 'other-month'}}
            {{dayObj.disabled ? 'disabled' : ''}}
            {{dayObj.selected ? 'selected' : ''}}
            {{dayObj.today ? 'today' : ''}}"
               onclick="{{action('selectDay', dayObj)}}">
            {{dayObj.day}}
          </span>
        </template>
      </div>

      <!-- Time Picker -->
      <template lyte-if="{{zcatProp.showTime}}">
        <div class="zcat-datepicker-time">
          <span class="zcat-datepicker-time-label">Time</span>
          <div class="zcat-datepicker-time-inputs">
            <input type="text" class="zcat-datepicker-time-input" value="{{hours}}" maxlength="2" oninput="{{action('onHoursChange')}}" />
            <span class="zcat-datepicker-time-sep">:</span>
            <input type="text" class="zcat-datepicker-time-input" value="{{minutes}}" maxlength="2" oninput="{{action('onMinutesChange')}}" />
            <span class="zcat-datepicker-time-sep">:</span>
            <input type="text" class="zcat-datepicker-time-input" value="{{seconds}}" maxlength="2" oninput="{{action('onSecondsChange')}}" />
            <span class="zcat-datepicker-ampm" onclick="{{action('toggleAmPm')}}">{{ampm}}</span>
          </div>
        </div>
      </template>

      <!-- Footer -->
      <div class="zcat-datepicker-footer">
        <span class="zcat-datepicker-footer-link" onclick="{{action('resetDate')}}">Reset</span>
        <div class="zcat-datepicker-footer-right">
          <button class="zcat-datepicker-btn-cancel" onclick="{{action('closePicker')}}">Close</button>
          <button class="zcat-datepicker-btn-apply" onclick="{{action('applyDate')}}">Apply</button>
        </div>
      </div>
    </div>

    <!-- Error Message -->
    <template lyte-if="{{zcatProp.errorMessage}}">
      <div class="zcat-datepicker-error-msg">{{zcatProp.errorMessage}}</div>
    </template>
  </div>
</template>
