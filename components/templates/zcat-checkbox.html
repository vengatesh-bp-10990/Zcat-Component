<template tag-name="zcat-checkbox">
  <label class="zcat-checkbox-wrap
    {{zcatProp.size === 'small' ? 'zcat-checkbox-sm' : zcatProp.size === 'extra-small' ? 'zcat-checkbox-exsm' : ''}}
    {{zcatProp.variant === 'secondary' ? 'zcat-checkbox-secondary' : 'zcat-checkbox-primary'}}
    {{zcatProp.disabled ? 'zcat-checkbox-disabled' : ''}}
    {{zcatProp.classCss || ''}}">
    <input type="checkbox"
           class="zcat-checkbox-input"
           checked="{{isChecked}}"
           disabled="{{zcatProp.disabled}}"
           onclick="{{action('onCheckboxChange')}}"/>
    <span class="zcat-checkbox-box {{isChecked ? 'checked' : ''}} {{isPartial ? 'partial' : ''}}">
      <template lyte-if="{{isChecked && !isPartial}}">
        <svg class="zcat-checkbox-tick" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.5 8 6.5 11 12.5 5"/></svg>
      </template>
      <template lyte-if="{{isPartial}}">
        <svg class="zcat-checkbox-partial" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="8" x2="12" y2="8"/></svg>
      </template>
    </span>
    <template lyte-if="{{zcatProp.label}}">
      <span class="zcat-checkbox-label">{{zcatProp.label}}</span>
    </template>
  </label>
</template>
