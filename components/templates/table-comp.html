<template tag-name="table-comp">
  <div class="zcat-page-wrapper">
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Table</h1>
      <p class="zcat-page-desc">Tables display structured data in rows and columns with sorting, selection, and action support.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <!-- Customize Tab -->
    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area" style="padding:0;overflow-x:auto">
            <zcat-table self="{{self}}" zcat-prop="{{tableObj}}"></zcat-table>
          </div>
        </div>
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>

      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Style</span>
            <select onchange="{{action('changeTableVariant', event)}}" class="zcat-custom-select">
              <option value="default">Default</option>
              <option value="striped">Striped</option>
              <option value="bordered">Bordered</option>
              <option value="compact">Compact</option>
            </select>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Checkbox</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleCheckboxObj}}"></zcat-toggle>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">More Options</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleMoreObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <!-- All Variants Tab -->
    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Default</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card" style="min-width:480px">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Default Table</span></div>
          <div class="zcat-variant-card-preview" style="padding:0;overflow-x:auto">
            <zcat-table self="{{self}}" zcat-prop="{{variantDefaultObj}}"></zcat-table>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Striped</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card" style="min-width:480px">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Striped Rows</span></div>
          <div class="zcat-variant-card-preview" style="padding:0;overflow-x:auto">
            <zcat-table self="{{self}}" zcat-prop="{{variantStripedObj}}"></zcat-table>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Bordered</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card" style="min-width:480px">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Bordered Table</span></div>
          <div class="zcat-variant-card-preview" style="padding:0;overflow-x:auto">
            <zcat-table self="{{self}}" zcat-prop="{{variantBorderedObj}}"></zcat-table>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Compact</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card" style="min-width:480px">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Compact Table</span></div>
          <div class="zcat-variant-card-preview" style="padding:0;overflow-x:auto">
            <zcat-table self="{{self}}" zcat-prop="{{variantCompactObj}}"></zcat-table>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">With Checkbox & Actions</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card" style="min-width:480px">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Selection & More Options</span></div>
          <div class="zcat-variant-card-preview" style="padding:0;overflow-x:auto">
            <zcat-table self="{{self}}" zcat-prop="{{variantCheckboxObj}}"></zcat-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
