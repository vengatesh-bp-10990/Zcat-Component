<template tag-name="zcat-double-field">
  <div class="zcat-doublefield-wrapper
    {{zcatProp.disabled ? 'zcat-doublefield-disabled' : ''}}
    {{zcatProp.errorMessage ? 'zcat-doublefield-error' : ''}}
    {{zcatProp.size === 'small' ? 'zcat-doublefield-sm' : zcatProp.size === 'extra-small' ? 'zcat-doublefield-exsm' : ''}}">

    <!-- Label Row -->
    <template lyte-if="{{zcatProp.label}}">
      <div class="zcat-doublefield-label-row">
        <label class="zcat-doublefield-label">{{zcatProp.label}}</label>
        <template lyte-if="{{zcatProp.isOptional}}">
          <span class="zcat-doublefield-optional">(Optional)</span>
        </template>
      </div>
    </template>

    <!-- Fields row -->
    <div class="zcat-doublefield-row">
      <template lyte-for="{{zcatProp.fields}} as field fieldIdx">
        <div class="zcat-doublefield-item
          {{fieldIdx === 0 ? 'zcat-field-first' : ''}}
          {{fieldIdx === zcatProp.fields.length - 1 ? 'zcat-field-last' : ''}}
          {{fieldIdx > 0 && fieldIdx < zcatProp.fields.length - 1 ? 'zcat-field-mid' : ''}}"
          style="{{field.width ? 'width:' + field.width : 'flex:1'}}">

          <template lyte-if="{{field.type === 'input'}}">
            <zcat-input self="{{self}}" zcat-prop="{{field.props}}"></zcat-input>
          </template>
          <template lyte-if="{{field.type === 'dropdown'}}">
            <zcat-dropdown self="{{self}}" zcat-prop="{{field.props}}"></zcat-dropdown>
          </template>
        </div>
      </template>
    </div>

    <!-- Error Message -->
    <template lyte-if="{{zcatProp.errorMessage}}">
      <div class="zcat-doublefield-error-msg">{{zcatProp.errorMessage}}</div>
    </template>
  </div>
</template>
