<template tag-name="alert-comp">
  <div class="zcat-page-wrapper">
    <!-- Header -->
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Alert</h1>
      <p class="zcat-page-desc">Alerts display contextual feedback messages for user actions — info, success, warning, or error.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <!-- Body: Customize Tab -->
    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <!-- Left: Preview + Code -->
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area" style="padding:20px;">
            <zcat-alert self="{{self}}" zcat-prop="{{alertObj}}"></zcat-alert>
          </div>
        </div>
        <!-- Code Tabs -->
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'newslyte' ? 'active' : ''}}" onclick="{{action('showNewSlyteTab')}}">sLyte New</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'newslyte'}}">{{newSlyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>

      <!-- Right: Customise -->
      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <!-- Type -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Type</span>
            <select data-action="changeAlertType" class="zcat-custom-select">
              <option value="info">Info</option>
              <option value="success">Success</option>
              <option value="warning">Warning</option>
              <option value="error">Error</option>
            </select>
          </div>
          <!-- Header toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Header</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleHeaderObj}}"></zcat-toggle>
          </div>
          <!-- Closable toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Closable</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleClosableObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <!-- Body: All Variants Tab -->
    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Alert Types</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Info</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-alert self="{{self}}" zcat-prop="{{variantInfoObj}}"></zcat-alert>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Success</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-alert self="{{self}}" zcat-prop="{{variantSuccessObj}}"></zcat-alert>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Warning</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-alert self="{{self}}" zcat-prop="{{variantWarningObj}}"></zcat-alert>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Error</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-alert self="{{self}}" zcat-prop="{{variantErrorObj}}"></zcat-alert>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">With Header</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Info + Header</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-alert self="{{self}}" zcat-prop="{{variantInfoHeaderObj}}"></zcat-alert>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Success + Header</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-alert self="{{self}}" zcat-prop="{{variantSuccessHeaderObj}}"></zcat-alert>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Warning + Header</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-alert self="{{self}}" zcat-prop="{{variantWarningHeaderObj}}"></zcat-alert>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Error + Header</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-alert self="{{self}}" zcat-prop="{{variantErrorHeaderObj}}"></zcat-alert>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Non-Closable</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Info (no close)</span></div>
          <div class="zcat-variant-card-preview" style="padding:12px;">
            <zcat-alert self="{{self}}" zcat-prop="{{variantNonClosableObj}}"></zcat-alert>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
