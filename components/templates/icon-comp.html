<template tag-name="icon-comp">
  <div class="zcat-page-wrapper">
    <!-- Header -->
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Icon</h1>
      <p class="zcat-page-desc">A unified icon library for the ZCAT Design System. Click any icon to copy its component tag.</p>
    </div>

    <!-- Body -->
    <div class="zcat-page-body" style="flex-direction:row; gap:24px;">
      <!-- Left: Icon Grid -->
      <div class="zcat-page-left" style="flex:1;">
        <!-- Search -->
        <div class="zcat-icon-search-wrap">
          <zcat-icon name="search" width="14" height="14" stroke="var(--zcat-text-tertiary)"></zcat-icon>
          <input type="text" class="zcat-icon-search-input" placeholder="Search icons..." oninput="{{action('searchIcons', event)}}"/>
        </div>

        <!-- Icon Count -->
        <div class="zcat-icon-meta">
          <span class="zcat-icon-meta-count">{{filteredCount}} icons</span>
        </div>

        <!-- Icon Grid -->
        <div class="zcat-icon-grid">
          <template lyte-for="{{iconList}} as iconItem iconIdx">
            <div class="zcat-icon-card {{iconItem.hidden ? 'zcat-icon-hidden' : ''}}" onclick="{{action('copyIconTag', iconItem)}}" title="Click to copy: {{iconItem.name}}">
              <div class="zcat-icon-card-preview">
                <zcat-icon name="{{iconItem.name}}" width="{{iconSize}}" height="{{iconSize}}" stroke="{{iconColor}}" stroke-width="{{iconStrokeWidth}}"></zcat-icon>
              </div>
              <span class="zcat-icon-card-label">{{iconItem.name}}</span>
            </div>
          </template>
        </div>

        <!-- Code Tabs -->
        <div class="zcat-code-tabs" style="margin-top:24px;">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'newslyte' ? 'active' : ''}}" onclick="{{action('showNewSlyteTab')}}">sLyte New</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'newslyte'}}">{{newSlyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>

        <!-- Copied Toast -->
        <div class="zcat-icon-copied-toast {{showCopied ? 'zcat-icon-copied-show' : ''}}">
          <zcat-icon name="tick-circle" width="14" height="14" stroke="var(--zcat-alerts-success-text-primary)"></zcat-icon>
          <span>{{copiedText}}</span>
        </div>
      </div>

      <!-- Right: Customise -->
      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
        </div>
        <div class="zcat-custom-body">
          <!-- Icon Size -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Icon Size</span>
            <select onchange="{{action('changeIconSize', event)}}" class="zcat-custom-select">
              <option value="12">12px</option>
              <option value="14">14px</option>
              <option value="16" selected>16px</option>
              <option value="20">20px</option>
              <option value="24">24px</option>
              <option value="32">32px</option>
              <option value="48">48px</option>
            </select>
          </div>
          <!-- Stroke Width -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Stroke Width</span>
            <div class="zcat-icon-slider-row">
              <input type="range" class="zcat-icon-slider" oninput="{{action('changeStrokeWidth', event)}}" min="0.5" max="3" step="0.1" value="1.3"/>
              <span class="zcat-icon-slider-value">{{iconStrokeWidth}}</span>
            </div>
          </div>
          <!-- Static Icon Color -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Icon Color</span>
            <div class="zcat-icon-color-row">
              <input type="color" class="zcat-icon-color-picker" oninput="{{action('changeIconColor', event)}}" value="{{iconColor}}"/>
              <input type="text" class="zcat-icon-color-text" onchange="{{action('changeIconColorText', event)}}" value="{{iconColor}}" placeholder="#555555"/>
            </div>
          </div>
        </div>


      </div>
    </div>
  </div>
</template>
