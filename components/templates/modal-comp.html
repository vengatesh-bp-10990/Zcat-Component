<template tag-name="modal-comp">
  <div class="zcat-page-wrapper">
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Modal</h1>
      <p class="zcat-page-desc">Modals display content in a focused overlay that requires user interaction before returning to the main view.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <!-- Customize Tab -->
    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area" style="display:flex;align-items:center;justify-content:center;min-height:120px;">
            <zcat-button self="{{self}}" zcat-prop="{{openBtnObj}}"></zcat-button>
            <zcat-modal self="{{self}}" zcat-prop="{{modalObj}}"></zcat-modal>
          </div>
        </div>
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>

      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Size</span>
            <select onchange="{{action('changeModalSize', event)}}" class="zcat-custom-select">
              <option value="default">Default (520px)</option>
              <option value="small">Small (400px)</option>
              <option value="large">Large (720px)</option>
              <option value="full">Full screen</option>
            </select>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Description</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleDescObj}}"></zcat-toggle>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Back Arrow</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleBackObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <!-- All Variants Tab -->
    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Sizes</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Default (520px)</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px;text-align:center">
            <zcat-modal self="{{self}}" zcat-prop="{{variantDefaultObj}}" data-modal-id="v-default"></zcat-modal>
            <zcat-button self="{{self}}" zcat-prop="{{openVarDefaultBtnObj}}"></zcat-button>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Small (400px)</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px;text-align:center">
            <zcat-modal self="{{self}}" zcat-prop="{{variantSmallObj}}" data-modal-id="v-small"></zcat-modal>
            <zcat-button self="{{self}}" zcat-prop="{{openVarSmallBtnObj}}"></zcat-button>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Large (720px)</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px;text-align:center">
            <zcat-modal self="{{self}}" zcat-prop="{{variantLargeObj}}" data-modal-id="v-large"></zcat-modal>
            <zcat-button self="{{self}}" zcat-prop="{{openVarLargeBtnObj}}"></zcat-button>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Features</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">With Description</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px;text-align:center">
            <zcat-modal self="{{self}}" zcat-prop="{{variantWithDescObj}}" data-modal-id="v-desc"></zcat-modal>
            <zcat-button self="{{self}}" zcat-prop="{{openVarWithDescBtnObj}}"></zcat-button>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Back Arrow</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px;text-align:center">
            <zcat-modal self="{{self}}" zcat-prop="{{variantBackArrowObj}}" data-modal-id="v-back"></zcat-modal>
            <zcat-button self="{{self}}" zcat-prop="{{openVarBackBtnObj}}"></zcat-button>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Footer Actions</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px;text-align:center">
            <zcat-modal self="{{self}}" zcat-prop="{{variantFooterActionsObj}}" data-modal-id="v-footer"></zcat-modal>
            <zcat-button self="{{self}}" zcat-prop="{{openVarFooterBtnObj}}"></zcat-button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
