<template tag-name="checkbox-comp">
  <div class="zcat-page-wrapper">
    <!-- Header -->
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Checkbox</h1>
      <p class="zcat-page-desc">Checkboxes allow users to select one or more items from a list, or toggle a single option on/off.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <!-- Body: Customize Tab -->
    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <!-- Left: Preview + Code -->
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area">
            <zcat-checkbox self="{{self}}" zcat-prop="{{checkboxObj}}"></zcat-checkbox>
          </div>
        </div>
        <!-- Code Tabs -->
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'newslyte' ? 'active' : ''}}" onclick="{{action('showNewSlyteTab')}}">sLyte New</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'newslyte'}}">{{newSlyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>

      <!-- Right: Customise -->
      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <!-- Size -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Size</span>
            <select onchange="{{action('changeCheckboxSize', event)}}" class="zcat-custom-select">
              <option value="default">Default</option>
              <option value="small">Small</option>
              <option value="extra-small">Extra-small</option>
            </select>
          </div>
          <!-- Label toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Label</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleLabelObj}}"></zcat-toggle>
          </div>
          <!-- Checked toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Checked</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleCheckedObj}}"></zcat-toggle>
          </div>
          <!-- Partial toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Partial</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{togglePartialObj}}"></zcat-toggle>
          </div>
          <!-- Disabled toggle -->
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Disabled</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleDisabledObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <!-- Body: All Variants Tab -->
    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">States</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Unchecked</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-checkbox self="{{self}}" zcat-prop="{{varUncheckedObj}}"></zcat-checkbox>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Checked</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-checkbox self="{{self}}" zcat-prop="{{varCheckedObj}}"></zcat-checkbox>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Partial</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-checkbox self="{{self}}" zcat-prop="{{varPartialObj}}"></zcat-checkbox>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Without Label</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-checkbox self="{{self}}" zcat-prop="{{varNoLabelObj}}"></zcat-checkbox>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Sizes</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Default</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-checkbox self="{{self}}" zcat-prop="{{varSizeDefaultObj}}"></zcat-checkbox>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Small</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-checkbox self="{{self}}" zcat-prop="{{varSizeSmallObj}}"></zcat-checkbox>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Extra-small</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-checkbox self="{{self}}" zcat-prop="{{varSizeExsmObj}}"></zcat-checkbox>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Disabled</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Disabled Unchecked</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-checkbox self="{{self}}" zcat-prop="{{varDisabledObj}}"></zcat-checkbox>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Disabled Checked</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-checkbox self="{{self}}" zcat-prop="{{varDisabledCheckedObj}}"></zcat-checkbox>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Disabled Partial</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-checkbox self="{{self}}" zcat-prop="{{varDisabledPartialObj}}"></zcat-checkbox>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
