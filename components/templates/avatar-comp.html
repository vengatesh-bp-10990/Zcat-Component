<template tag-name="avatar-comp">
  <div class="zcat-page-wrapper">
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Avatar</h1>
      <p class="zcat-page-desc">Avatars represent users or entities with images, initials, or icons in various sizes and states.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <!-- Customize Tab -->
    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area">
            <zcat-avatar self="{{self}}" zcat-prop="{{avatarObj}}"></zcat-avatar>
          </div>
        </div>
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>

      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Type</span>
            <select data-action="changeAvatarType" class="zcat-custom-select">
              <option value="letter">Letter</option>
              <option value="icon">Icon</option>
              <option value="img">Image</option>
            </select>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Size</span>
            <select data-action="changeAvatarSize" class="zcat-custom-select">
              <option value="small">Small</option>
              <option value="medium" selected>Medium</option>
              <option value="large">Large</option>
              <option value="extra-large">Extra Large</option>
            </select>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Status</span>
            <select data-action="changeAvatarStatus" class="zcat-custom-select">
              <option value="online">Online</option>
              <option value="busy">Busy</option>
              <option value="away">Away</option>
              <option value="offline">Offline</option>
              <option value="none">None</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- All Variants Tab -->
    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Types</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Icon</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantIconObj}}"></zcat-avatar>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Letter</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantLetterObj}}"></zcat-avatar>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Image</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantImgObj}}"></zcat-avatar>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Sizes</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Small (24px)</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantSmObj}}"></zcat-avatar>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Medium (32px)</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantMdObj}}"></zcat-avatar>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Large (40px)</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantLgObj}}"></zcat-avatar>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Extra Large (56px)</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantXlObj}}"></zcat-avatar>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Status</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Online</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantOnlineObj}}"></zcat-avatar>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Busy</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantBusyObj}}"></zcat-avatar>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Away</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantAwayObj}}"></zcat-avatar>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Offline</span></div>
          <div class="zcat-variant-card-preview">
            <zcat-avatar self="{{self}}" zcat-prop="{{variantOfflineObj}}"></zcat-avatar>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
