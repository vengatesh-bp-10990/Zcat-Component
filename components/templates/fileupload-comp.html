<template tag-name="fileupload-comp">
  <div class="zcat-page-wrapper">
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">File Upload</h1>
      <p class="zcat-page-desc">Drag-and-drop or click-to-browse file upload component with single and multiple modes.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area" style="padding:24px">
            <zcat-fileupload self="{{self}}" zcat-prop="{{fileuploadObj}}"></zcat-fileupload>
          </div>
        </div>
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>
      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Variant</span>
            <select data-action="changeVariant" class="zcat-custom-select">
              <option value="primary">Primary (Dropzone)</option>
              <option value="secondary">Secondary (Button)</option>
            </select>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Label</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleLabelObj}}"></zcat-toggle>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Multiple</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleMultipleObj}}"></zcat-toggle>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Disabled</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleDisabledObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Upload Variants</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Primary (Dropzone)</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px">
            <div class="zcat-fileupload-dropzone" style="min-height:100px;border:2px dashed var(--zcat-inputField-border-default);border-radius:10px;display:flex;align-items:center;justify-content:center">
              <p style="font-size:13px;color:var(--zcat-body-text-secondary)">Click to upload or drag and drop</p>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Secondary (Button)</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px">
            <div class="zcat-fileupload-btn-wrap">
              <button class="zcat-fileupload-btn" style="display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:36px;font-size:14px;color:var(--zcat-primary-1);border:1px solid var(--zcat-primary-1);border-radius:6px;background:transparent;cursor:pointer">
                <span>Choose File</span>
              </button>
              <span style="font-size:12px;color:var(--zcat-inputField-text-placeholder)">PNG, JPG up to 5MB</span>
            </div>
          </div>
        </div>
        <div class="zcat-variant-card">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Disabled</span></div>
          <div class="zcat-variant-card-preview" style="padding:16px">
            <div class="zcat-fileupload-dropzone" style="min-height:100px;border:2px dashed var(--zcat-inputField-border-disabled);border-radius:10px;display:flex;align-items:center;justify-content:center;opacity:0.5">
              <p style="font-size:13px;color:var(--zcat-inputField-text-disabled)">Upload disabled</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
