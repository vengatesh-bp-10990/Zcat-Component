<template tag-name="zcat-keyvalue-pair">
  <div class="zcat-kvp-wrapper {{zcatProp.disabled ? 'zcat-kvp-disabled' : ''}}">

    <!-- Label Row -->
    <template lyte-if="{{zcatProp.label}}">
      <div class="zcat-kvp-label-row">
        <label class="zcat-kvp-label">{{zcatProp.label}}</label>
      </div>
    </template>

    <!-- Column Headers -->
    <template lyte-if="{{zcatProp.fieldDefs && zcatProp.fieldDefs.length}}">
      <div class="zcat-kvp-header">
        <template lyte-for="{{zcatProp.fieldDefs}} as fieldDef fIdx">
          <span class="zcat-kvp-header-cell" style="{{fieldDef.width ? 'width:' + fieldDef.width : 'flex:1'}}">{{fieldDef.label}}</span>
        </template>
        <span class="zcat-kvp-header-action"></span>
      </div>
    </template>

    <!-- Rows -->
    <div class="zcat-kvp-body">
      <template lyte-for="{{rows}} as row rowIdx">
        <div class="zcat-kvp-row">
          <template lyte-for="{{zcatProp.fieldDefs}} as fieldDef fIdx">
            <div class="zcat-kvp-cell" style="{{fieldDef.width ? 'width:' + fieldDef.width : 'flex:1'}}">
              <input
                type="text"
                class="zcat-kvp-input"
                placeholder="{{fieldDef.placeholder || fieldDef.label || ''}}"
                value="{{row[fieldDef.key]}}"
                disabled="{{zcatProp.disabled || false}}"
                oninput="{{action('onFieldInput', row, fieldDef.key)}}"
              />
            </div>
          </template>
          <div class="zcat-kvp-row-actions">
            <span class="zcat-kvp-remove-btn" onclick="{{action('removeRow', row)}}" title="Remove row">
              <zcat-icon name="close" width="14" height="14" stroke="currentColor" stroke-width="2"></zcat-icon>
            </span>
          </div>
        </div>
      </template>
    </div>

    <!-- Add Row Button -->
    <template lyte-if="{{!zcatProp.disabled}}">
      <div class="zcat-kvp-add-wrap">
        <button class="zcat-kvp-add-btn" onclick="{{action('addRow')}}">
          <zcat-icon name="plus" width="14" height="14" stroke="currentColor" stroke-width="2"></zcat-icon>
          <span>{{zcatProp.addLabel || 'Add Row'}}</span>
        </button>
      </div>
    </template>
  </div>
</template>
