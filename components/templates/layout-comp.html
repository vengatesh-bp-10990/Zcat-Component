<template tag-name="layout-comp">
    <div class="zcat-app-layout">
        <aside class="zcat-sidebar">
            <div class="zcat-sidebar-brand">

                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/></svg>

            <div class="zcat-sidebar-nav" data-sidebar-nav>

                        <a href="#/installation" class="zcat-sidebar-item" data-search-label="installation setup install">

                            <span class="zcat-badge-stable">Stable</span>

                            <span class="zcat-badge-stable">Stable</span>
                        </a>
                        <a href="#/checkbox" class="zcat-sidebar-item" data-search-label="checkbox check tick select multi">

                            <span class="zcat-badge-stable">Stable</span>
                        </a>
                        <a href="#/toggle" class="zcat-sidebar-item" data-search-label="toggle switch on off">

                        </a>
                        <div class="zcat-sidebar-group-title">FEEDBACK</div>
                        <a href="#/alert" class="zcat-sidebar-item" data-search-label="alert toast notification banner message">

                        <a href="#/attention" class="zcat-sidebar-item" data-search-label="attention banner notice info inline">
                            <svg class="zcat-sidebar-item-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>

                            <span class="zcat-badge-stable">Stable</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Sidebar footer -->
            <div class="zcat-sidebar-footer">

                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>

                        <span class="zcat-topbar-title" data-breadcrumb-title>Overview</span>
                    </div>
                </div>
                <div class="zcat-topbar-right">

                    <div class="zcat-topbar-control">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>

                            <option value="inter">Inter</option>
                        </select>
                    </div>
                    <!-- Dark / Light Toggle -->
                    <div class="zcat-topbar-control">
                        <svg class="zcat-theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                        <svg class="zcat-theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                        <label class="zcat-toggle zcat-toggle-sm">
                            <input type="checkbox" checked data-action="toggleTheme"/>
                            <span class="zcat-toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </header>
            <div id="page-outlet" class="zcat-page-outlet"></div>

    <div class="zcat-toast-container" data-toast-container></div>
