<template tag-name="popover-comp">
  <div class="zcat-page-wrapper">
    <div class="zcat-page-header">
      <h1 class="zcat-page-title">Popover</h1>
      <p class="zcat-page-desc">Popovers display contextual menus, action lists, or nested options triggered by user interaction.</p>
      <div class="zcat-page-tabs">
        <span class="zcat-page-tab {{pageTab === 'customize' ? 'active' : ''}}" onclick="{{action('showCustomizeTab')}}">Customize</span>
        <span class="zcat-page-tab {{pageTab === 'variants' ? 'active' : ''}}" onclick="{{action('showVariantsTab')}}">All Variants</span>
        <span class="zcat-page-tab">Change Logs</span>
      </div>
    </div>

    <!-- Customize Tab -->
    <div class="zcat-page-body" lyte-if="{{pageTab === 'customize'}}">
      <div class="zcat-page-left">
        <h3 class="zcat-section-label">preview</h3>
        <div class="zcat-preview-box">
          <div class="zcat-preview-area" style="min-height:260px;display:flex;align-items:flex-start;justify-content:center;padding-top:20px">
            <zcat-popover self="{{self}}" zcat-prop="{{popoverObj}}"></zcat-popover>
          </div>
        </div>
        <div class="zcat-code-tabs">
          <span class="zcat-code-tab {{activeTab === 'slyte' ? 'active' : ''}}" onclick="{{action('showSlyteTab')}}">sLyte</span>
          <span class="zcat-code-tab {{activeTab === 'js' ? 'active' : ''}}" onclick="{{action('showJsTab')}}">JS</span>
          <span class="zcat-code-tab {{activeTab === 'html' ? 'active' : ''}}" onclick="{{action('showHtmlTab')}}">HTML</span>
          <span class="zcat-code-tab {{activeTab === 'css' ? 'active' : ''}}" onclick="{{action('showCssTab')}}">CSS</span>
        </div>
        <div class="zcat-code-panel">
          <div class="zcat-code-lines">
            <pre lyte-if="{{activeTab === 'slyte'}}">{{slyteCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'js'}}">{{jsCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'html'}}">{{htmlCodeSnippet.code}}</pre>
            <pre lyte-if="{{activeTab === 'css'}}">{{cssCodeSnippet.code}}</pre>
          </div>
          <span class="zcat-code-copy" onclick="{{action('copyCode')}}" title="Copy code">
            <zcat-icon name="copy" width="16" height="16" stroke="currentColor" stroke-width="1.3"></zcat-icon>
          </span>
        </div>
      </div>

      <div class="zcat-page-right">
        <div class="zcat-custom-header">
          <h3 class="zcat-custom-title">Customise</h3>
          <zcat-button self="{{self}}" zcat-prop="{{resetButtonObj}}"></zcat-button>
        </div>
        <div class="zcat-custom-body">
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Position</span>
            <select data-action="changePopoverPosition" class="zcat-custom-select">
              <option value="bottom">Bottom</option>
              <option value="top">Top</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Searchable</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleSearchObj}}"></zcat-toggle>
          </div>
          <div class="zcat-custom-row">
            <span class="zcat-custom-label">Heading</span>
            <zcat-toggle self="{{self}}" zcat-prop="{{toggleHeadingObj}}"></zcat-toggle>
          </div>
        </div>
      </div>
    </div>

    <!-- All Variants Tab -->
    <div class="zcat-page-left" lyte-if="{{pageTab === 'variants'}}" style="flex:1">
      <h3 class="zcat-section-label" style="margin-top:4px">Basic</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card" style="min-height:240px">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Basic Menu</span></div>
          <div class="zcat-variant-card-preview" style="display:flex;align-items:flex-start;justify-content:center;padding-top:12px">
            <zcat-popover self="{{self}}" zcat-prop="{{variantBasicObj}}"></zcat-popover>
          </div>
        </div>
        <div class="zcat-variant-card" style="min-height:240px">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">With Icons</span></div>
          <div class="zcat-variant-card-preview" style="display:flex;align-items:flex-start;justify-content:center;padding-top:12px">
            <zcat-popover self="{{self}}" zcat-prop="{{variantIconObj}}"></zcat-popover>
          </div>
        </div>
      </div>

      <h3 class="zcat-section-label" style="margin-top:24px">Advanced</h3>
      <div class="zcat-variants-grid">
        <div class="zcat-variant-card" style="min-height:280px">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Searchable</span></div>
          <div class="zcat-variant-card-preview" style="display:flex;align-items:flex-start;justify-content:center;padding-top:12px">
            <zcat-popover self="{{self}}" zcat-prop="{{variantSearchObj}}"></zcat-popover>
          </div>
        </div>
        <div class="zcat-variant-card" style="min-height:280px">
          <div class="zcat-variant-card-head"><span class="zcat-variant-card-title">Nested Submenu</span></div>
          <div class="zcat-variant-card-preview" style="display:flex;align-items:flex-start;justify-content:center;padding-top:12px">
            <zcat-popover self="{{self}}" zcat-prop="{{variantNestedObj}}"></zcat-popover>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
